<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f11">
  <title>Sandbox Stan · practice</title>
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="sandbox.css">
</head>
<body class="sbx">
  <div id="sbx-bar" role="region" aria-label="Practice"></div>
  <main id="app" aria-live="polite"><p class="boot">Setting up the practice runs…</p></main>
  <div id="toast" role="status" hidden></div>
  <script>try { var t = localStorage.getItem('stb-theme') || 'night', hr = +new Intl.DateTimeFormat('en-NZ', { timeZone: 'Pacific/Auckland', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); if (t === 'night' || (t === 'auto' && (hr >= 19 || hr < 7))) document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); }</script>
  <script type="module" src="sandbox.js"></script>
</body>
</html>
