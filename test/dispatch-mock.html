<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body><div id="app"></div><div id="toast" hidden></div>
<!-- Dispatch dashboard with a stand-in database, for checking screens without Supabase. Serve the repo root (python3 -m http.server) and open /test/dispatch-mock.html#locations. Maps need internet. -->
<script type="module">
const uuid = () => crypto.randomUUID();
const T = {
  members: [{ email: 'mike@example.com', display_name: 'Mike', role: 'dispatcher', active: true }, { email: 'lisa@example.com', display_name: 'Lisa', role: 'driver', active: true }],
  location_groups: [], operating_locations: [], service_locations: [], location_policies: [],
  addresses: [
    { address_key: 'HOWICK|AMON|101', area: 'HOWICK', street: 'BRUCE MCLAREN VILLAGE AMON', number: '101', routes: ['HOWICK08'], first_seen: '2026-11-05', last_seen: '2026-11-09', gps_lat: -36.9001, gps_lng: 174.9301, gps_taps: 3, gps_accuracy_m: 8 },
    { address_key: 'HOWICK|UXBRIDGE ROAD|38B', area: 'HOWICK', street: 'UXBRIDGE ROAD', number: '38B', routes: ['HOWICK06'], first_seen: '2026-11-06', last_seen: '2026-11-09' },
    { address_key: 'HOWICK|UXBRIDGE ROAD|25', area: 'HOWICK', street: 'UXBRIDGE ROAD', number: '25', routes: ['HOWICK06'], first_seen: '2026-11-06', last_seen: '2026-11-09', gps_lat: -36.899, gps_lng: 174.931, gps_taps: 1, gps_accuracy_m: 12 },
  ],
};
const view = (t) => t === 'address_register' ? T.addresses.map((a) => ({ ...a, operating_name: T.operating_locations.find((o) => o.id === a.operating_location_id)?.name, service_name: T.service_locations.find((s) => s.id === a.service_location_id)?.name })) : T[t];
window.calls = [];
function from(t) {
  let op = 'select', row = null, filters = [], single = false;
  const b = {
    select() { return b; }, order() { return b; }, single() { single = true; return b; }, maybeSingle() { single = true; return b; },
    insert(r) { op = 'insert'; row = r; return b; }, update(r) { op = 'update'; row = r; return b; }, delete() { op = 'delete'; return b; },
    eq(c, v) { filters.push((x) => x[c] === v); return b; }, ilike(c, v) { filters.push((x) => String(x[c]).toLowerCase() === v.toLowerCase()); return b; },
    in(c, vs) { filters.push((x) => vs.includes(x[c])); return b; }, not(c, _is, v) { filters.push((x) => x[c] != null); return b; },
    then(res, rej) {
      window.calls.push([t, op, row]);
      let data, error = null;
      const base = t === 'address_register' ? 'addresses' : t;
      if (op === 'select') data = view(t).filter((x) => filters.every((f) => f(x)));
      if (op === 'insert') { const r = { id: uuid(), active: true, ...row }; if (base === 'location_policies' && [r.group_id, r.operating_location_id, r.service_location_id, r.address_key].filter(Boolean).length !== 1) error = { message: 'one target' }; else T[base].push(r); data = [r]; }
      if (op === 'update') { data = T[base].filter((x) => filters.every((f) => f(x))); data.forEach((x) => Object.assign(x, row)); }
      if (op === 'delete') { data = T[base].filter((x) => filters.every((f) => f(x))); T[base] = T[base].filter((x) => !data.includes(x)); }
      if (single) data = data?.[0] ?? null;
      return Promise.resolve({ data, error }).then(res, rej);
    },
  };
  return b;
}
const sb = { from, functions: { invoke: async (n, { body }) => { window.calls.push(['fn', n, body]); return { data: { ok: true }, error: null }; } } };
const h = (tag, props, ...kids) => { const el = document.createElement(tag); for (const [k, v] of Object.entries(props || {})) { if (v == null || v === false) continue; if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c)); return el; };
const mount = (...n) => document.getElementById('app').replaceChildren(...n);
const toast = (m) => { window.lastToast = m; console.log('TOAST', m); };
const titleCase = (s) => s.toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase());
const shortRoute = (r) => r.replace(/^[A-Z]+0?/, 'Run ');
const { viewDispatch } = await import('../js/dispatch.js');
window.T = T;
await viewDispatch({ app: { store: { mode: 'shared', sb }, me: { name: 'Mike', email: 'mike@example.com', role: 'dispatcher' } }, h, mount, toast, titleCase, shortRoute }, location.hash.slice(1) || 'addresses');
window.ready = true;
</script></body></html>
