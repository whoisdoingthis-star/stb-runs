<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f11">
  <title>Stan’s School · Send The Boy</title>
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="learn.css">
</head>
<body>
  <main id="school" aria-live="polite"><p class="boot">Loading Stan’s School…</p></main>
  <!-- Same colours as the app: night unless this phone chose day (set before the first paint). -->
  <script>try { var t = localStorage.getItem('stb-theme') || 'night', hr = +new Intl.DateTimeFormat('en-NZ', { timeZone: 'Pacific/Auckland', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); if (t === 'night' || (t === 'auto' && (hr >= 19 || hr < 7))) document.documentElement.classList.add('dark'); if (localStorage.getItem('stb-big') === '1') document.documentElement.classList.add('big'); } catch (e) { document.documentElement.classList.add('dark'); }</script>
  <script type="module" src="learn.js"></script>
</body>
</html>
